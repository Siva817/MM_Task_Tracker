<!DOCTYPE html>
<html>

<head>
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <h1>Manager Dashboard</h1>

    <label for="managerFilter"><b>Manager</b></label>

    <select id="managerFilter">

        <option value="All">All</option>

        {% for manager in managers %}

        <option value="{{ manager }}">
            {{ manager }}
        </option>

        {% endfor %}

    </select>

    <label for="dateFilter"><b>Date</b></label>

    <input
        type="date"
        id="dateFilter"
        value="{{ selected_date or '' }}"
    >

    <script>

        const dateFilter = document.getElementById("dateFilter");

        dateFilter.addEventListener("change", function () {

            const selectedDate = dateFilter.value;

            if (selectedDate === "") {
                window.location.href = "/manager";
                return;
            }

            window.location.href =
                "/manager?selected_date=" + selectedDate;

        });

    </script>




    <br><br>

    <table id="employeeTable" border="1" cellpadding="6" cellspacing="0">

        <thead>

            <tr>

                <th>Employee</th>
                <th>Manager</th>
                <th>Current Task</th>
                <th>Submitted At</th>

            </tr>

        </thead>

        <tbody>

            {% for submission in latest_submissions %}

            <tr data-manager="{{ submission.manager }}">

                <td>{{ submission.employee_name }}</td>
                <td>{{ submission.manager }}</td>
                <td>{{ submission.current_task }}</td>
                <td>{{ submission.submitted_at }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <script>
        const managerFilter = document.getElementById("managerFilter");
        const employeeRows = document.querySelectorAll("#employeeTable tbody tr");

        managerFilter.addEventListener("change", function () {

            const selectedManager = managerFilter.value;

            employeeRows.forEach(function (row) {

                const rowManager = row.dataset.manager;

                if (
                    selectedManager === "All" ||
                    rowManager === selectedManager
                ) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }

            });

        });
    </script>

</body>

</html>
