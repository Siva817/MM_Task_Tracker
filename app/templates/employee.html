<!DOCTYPE html>
<html>
<head>
    <title>MM Task Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>MM Task Tracker</h1>
    <h3>Employee Submission</h3>

    <p>Employee ID</p>
    <input type="text" id="employeeId">

    <p>Employee Name</p>
    <input type="text" id="employeeName">

    <p>Manager</p>
    <select id="manager">
        <option value="">Select Manager</option>
    </select>


    <p>Paste MM Dashboard</p>

    <textarea
        id = "dashboard"
        rows = "18"
        cols = "100"
        placeholder = "Paste MM Dashboard here..."
    ></textarea>

    <br><br>

    <button id="parseButton">Parse Tasks</button>

    <h3 id="taskCount"></h3>

    <table border="1" cellpadding="6" cellspacing="0">

        <thead>

            <tr>

                <th>Current</th>

                <th>Task</th>

                <th>SWAY</th>

                <th>MM</th>

                <th>Jobs</th>

                <th>Remarks</th>

            </tr>

        </thead>

        <tbody id="taskList">

        </tbody>

    </table>

    <br>

    <h3>Idle (Not Working on any task)</h3>
    <label>
        <input
        type = "radio"
        name = "currentTask"
        value = "idle"
        id = "idleRadio">
        Idle
    </label>

    <div id = "idleSection">
        <p>Drive Folder Link</p>
        <input 
        type = "text"
        id = "driveLink"
        placeholder = "Paste Drive File or Folder Link here..."
        size = "80">

        <br><br>

        <p>Remarks</p>
        <textarea
            id = "idleRemarks"
            rows = "3"
            cols = "80"
            placeholder = "Reason for being idle (optional)"
        ></textarea>

    </div>

    

    <br><br>


    <button id="submitButton">
        Submit
    </button>

    <script src="/static/script.js"></script>

</body>
</html>
